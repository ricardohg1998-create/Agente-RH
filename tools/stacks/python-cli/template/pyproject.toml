[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "__PROJECT_SLUG__"
version = "0.1.0"
description = "__PROJECT_NAME__ - __FIRST_DELIVERABLE__"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
__PROJECT_SLUG__ = "__PYTHON_PACKAGE__.cli:main"

[tool.setuptools]
