name: windows-checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run operational checks
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-checks.ps1

      - name: Run script tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-scripts.ps1
